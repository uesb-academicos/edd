name: Java CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar e testar
        run: |
          mkdir -p out
          find src tests -name '*.java' > sources.txt
          javac -encoding UTF-8 --release 21 -d out @sources.txt
          java -Djava.awt.headless=true -cp out TesteArvoreGenealogica
          java -cp out ArvoreGenealogica
      - name: Gerar JAR
        run: jar --create --file EDD-Arvore-Genealogica.jar --main-class br.uesb.edd.arvore.principal.AplicacaoPrincipal -C out ArvoreGenealogica.class -C out br
      - uses: actions/upload-artifact@v4
        with:
          name: arvore-genealogica-java21
          path: EDD-Arvore-Genealogica.jar
